interface:
  display_name: "UI Implementation Audit"
  short_description: "Audit an existing implemented UI end to end"
  default_prompt: "Use $ui-implementation-audit only after manually confirming and naming at least one repo-owned substantive product UI source file; an arbitrary path, import, empty view shell, route/provider/root mount, pre-implementation plan, mockup, prototype, style/asset, story/test, untouched scaffold, or backend-only repo does not qualify. Run the substantive recognized-source gate before artifacts or workers, using the exact type-to-component source-anchor relationship only for a manually verified unrecognized UI toolkit. If applicable, audit source, real hashed rendered evidence, journey decisions, and handler/backend/permission/persistence/test traces, then return a prioritized implementation and verification plan."
